name: Build and Deploy to Contabo VPS

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  VERSION: 1.0.${{ github.run_number }}
  API_IMAGE: ${{ secrets.DOCKER_HUB_USERNAME }}/suport-flow-ia-api
  WEB_IMAGE: ${{ secrets.DOCKER_HUB_USERNAME }}/suport-flow-ia-web
  WORKER_IMAGE: ${{ secrets.DOCKER_HUB_USERNAME }}/suport-flow-ia-worker

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Build and push API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ${{ env.API_IMAGE }}:${{ env.VERSION }}
            ${{ env.API_IMAGE }}:latest

      - name: Build and push Worker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/worker/Dockerfile
          push: true
          tags: |
            ${{ env.WORKER_IMAGE }}:${{ env.VERSION }}
            ${{ env.WORKER_IMAGE }}:latest

      - name: Build and push Web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          build-args: |
            NEXT_PUBLIC_API_URL=/api/v1
          push: true
          tags: |
            ${{ env.WEB_IMAGE }}:${{ env.VERSION }}
            ${{ env.WEB_IMAGE }}:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    env:
      CONTABO_HOST: ${{ secrets.CONTABO_HOST }}
      CONTABO_USER: ${{ secrets.CONTABO_USER }}
      CONTABO_SSH_KEY: ${{ secrets.CONTABO_SSH_KEY }}
      CONTABO_SSH_PORT: ${{ vars.CONTABO_SSH_PORT || '22' }}
      CONTABO_DEPLOY_PATH: ${{ vars.CONTABO_DEPLOY_PATH }}
      DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
      DOCKER_HUB_ACCESS_TOKEN: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
    steps:
      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          : "${CONTABO_HOST:?Set the CONTABO_HOST secret}"
          : "${CONTABO_USER:?Set the CONTABO_USER secret}"
          : "${CONTABO_SSH_KEY:?Set the CONTABO_SSH_KEY secret}"
          : "${DOCKER_HUB_USERNAME:?Set the DOCKER_HUB_USERNAME secret}"
          : "${DOCKER_HUB_ACCESS_TOKEN:?Set the DOCKER_HUB_ACCESS_TOKEN secret}"
          : "${CONTABO_DEPLOY_PATH:?Set the CONTABO_DEPLOY_PATH Actions variable}"
          [[ "$CONTABO_SSH_PORT" =~ ^[0-9]+$ ]]
          [[ "$DOCKER_HUB_USERNAME" =~ ^[A-Za-z0-9_-]+$ ]]
          [[ "$CONTABO_DEPLOY_PATH" =~ ^/[A-Za-z0-9._/-]+$ ]]
          [[ "$CONTABO_DEPLOY_PATH" != *".."* ]]
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$CONTABO_SSH_KEY" | tr -d '\r' > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          ssh-keyscan -H -p "$CONTABO_SSH_PORT" "$CONTABO_HOST" > "$HOME/.ssh/known_hosts"
          test -s "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Log in to Docker Hub on VPS
        shell: bash
        run: |
          printf '%s' "$DOCKER_HUB_ACCESS_TOKEN" |
            ssh -i "$HOME/.ssh/id_ed25519" \
              -p "$CONTABO_SSH_PORT" \
              -o BatchMode=yes \
              "$CONTABO_USER@$CONTABO_HOST" \
              "docker login --username '$DOCKER_HUB_USERNAME' --password-stdin"

      - name: Copy deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          destination="$CONTABO_USER@$CONTABO_HOST"
          ssh -i "$HOME/.ssh/id_ed25519" \
            -p "$CONTABO_SSH_PORT" \
            -o BatchMode=yes \
            "$destination" \
            "mkdir -p '$CONTABO_DEPLOY_PATH/nginx'"
          scp -i "$HOME/.ssh/id_ed25519" \
            -P "$CONTABO_SSH_PORT" \
            -o BatchMode=yes \
            docker-compose.yml \
            "$destination:$CONTABO_DEPLOY_PATH/docker-compose.yml"
          scp -i "$HOME/.ssh/id_ed25519" \
            -P "$CONTABO_SSH_PORT" \
            -o BatchMode=yes \
            nginx/default.conf \
            "$destination:$CONTABO_DEPLOY_PATH/nginx/default.conf"

      - name: Deploy containers
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/id_ed25519" \
            -p "$CONTABO_SSH_PORT" \
            -o BatchMode=yes \
            "$CONTABO_USER@$CONTABO_HOST" \
            "bash -s -- '$CONTABO_DEPLOY_PATH' '$DOCKER_HUB_USERNAME' '$VERSION'" <<'REMOTE'
          set -euo pipefail
          deploy_path="$1"
          docker_hub_username="$2"
          image_tag="$3"
          trap 'docker logout >/dev/null 2>&1 || true' EXIT
          cd "$deploy_path"
          test -f .env || { echo "Missing deployment .env file" >&2; exit 1; }
          test -f nginx/certbot/fullchain.pem || { echo "Missing nginx/certbot/fullchain.pem" >&2; exit 1; }
          test -f nginx/certbot/privkey.pem || { echo "Missing nginx/certbot/privkey.pem" >&2; exit 1; }
          export DOCKER_HUB_USERNAME="$docker_hub_username"
          export IMAGE_TAG="$image_tag"
          docker compose pull api worker web
          docker compose up -d --no-build --force-recreate api worker web nginx
          docker compose ps
          REMOTE