services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-support_flow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-support_flow_dev}
      POSTGRES_DB: ${POSTGRES_DB:-support_flow}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      PORT: 3001
      WEB_ORIGIN: http://localhost:${WEB_PORT:-3000}
      DATABASE_URL: postgresql://${POSTGRES_USER:-support_flow}:${POSTGRES_PASSWORD:-support_flow_dev}@postgres:5432/${POSTGRES_DB:-support_flow}?schema=public
      DEFAULT_ORGANIZATION_SLUG: ${DEFAULT_ORGANIZATION_SLUG:-support-flow}
      DEFAULT_ORGANIZATION_NAME: ${DEFAULT_ORGANIZATION_NAME:-SupportFlow}
      AUTH_SECURITY_PEPPER: ${AUTH_SECURITY_PEPPER:-development-only-pepper-change-before-production}
      AUTH_SESSION_TTL_SECONDS: ${AUTH_SESSION_TTL_SECONDS:-28800}
      ANONYMOUS_SESSION_TTL_SECONDS: ${ANONYMOUS_SESSION_TTL_SECONDS:-604800}
      AUTH_LOGIN_MAX_ATTEMPTS: ${AUTH_LOGIN_MAX_ATTEMPTS:-5}
      AUTH_LOGIN_WINDOW_SECONDS: ${AUTH_LOGIN_WINDOW_SECONDS:-900}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      BOOTSTRAP_ATTENDANT_EMAIL: ${BOOTSTRAP_ATTENDANT_EMAIL:-}
      BOOTSTRAP_ATTENDANT_PASSWORD: ${BOOTSTRAP_ATTENDANT_PASSWORD:-}
      FILE_STORAGE_ROOT: /app/uploads
      PDF_MAX_BYTES: ${PDF_MAX_BYTES:-10485760}
      PDF_MAX_PAGES: ${PDF_MAX_PAGES:-100}
      ARTICLE_MAX_CHARACTERS: ${ARTICLE_MAX_CHARACTERS:-100000}
    volumes:
      - knowledge_files:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${API_PORT:-3001}:3001"
    healthcheck:
      test: ["CMD", "node", "healthcheck.mjs"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    environment:
      WORKER_PORT: 3002
      WORKER_ID: ${WORKER_ID:-worker-compose-1}
      INGESTION_POLL_INTERVAL_MS: ${INGESTION_POLL_INTERVAL_MS:-2000}
      INGESTION_CLAIM_TIMEOUT_MS: ${INGESTION_CLAIM_TIMEOUT_MS:-120000}
      INGESTION_MAX_ATTEMPTS: ${INGESTION_MAX_ATTEMPTS:-3}
      INGESTION_RETRY_BASE_MS: ${INGESTION_RETRY_BASE_MS:-5000}
      INGESTION_EMBEDDING_BATCH_SIZE: ${INGESTION_EMBEDDING_BATCH_SIZE:-32}
      INGESTION_CHUNK_MAX_CHARACTERS: ${INGESTION_CHUNK_MAX_CHARACTERS:-1200}
      INGESTION_CHUNK_OVERLAP_CHARACTERS: ${INGESTION_CHUNK_OVERLAP_CHARACTERS:-200}
      FILE_STORAGE_ROOT: /app/uploads
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      OPENAI_EMBEDDING_DIMENSIONS: ${OPENAI_EMBEDDING_DIMENSIONS:-1536}
      OPENAI_EMBEDDING_TIMEOUT_MS: ${OPENAI_EMBEDDING_TIMEOUT_MS:-30000}
      DATABASE_URL: postgresql://${POSTGRES_USER:-support_flow}:${POSTGRES_PASSWORD:-support_flow_dev}@postgres:5432/${POSTGRES_DB:-support_flow}?schema=public
    volumes:
      - knowledge_files:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${WORKER_PORT:-3002}:3002"
    healthcheck:
      test: ["CMD", "node", "healthcheck.mjs"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:${API_PORT:-3001}/api/v1
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:${API_PORT:-3001}/api/v1
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "node", "healthcheck.mjs"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

volumes:
  postgres_data:
  knowledge_files:
